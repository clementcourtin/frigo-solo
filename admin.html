<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frigo Solo — Admin</title><style>body{margin:0;background:#f7f5ef;color:#222;font:16px system-ui;padding:28px}main{max-width:980px;margin:auto}h1{font-size:2.3rem;margin:0}a{color:#315c3b}.bar,.card{background:#fff;border:1px solid #dedbd1;border-radius:16px;padding:18px;margin:16px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#eef4ed;border-radius:12px;padding:14px}.stat b{font-size:1.7rem;display:block}table{width:100%;border-collapse:collapse}td,th{padding:12px 6px;border-bottom:1px solid #eee;text-align:left}.tag{background:#315c3b;color:#fff;padding:3px 8px;border-radius:99px;font-size:.8rem}@media(max-width:600px){body{padding:16px}.stats{grid-template-columns:1fr}table{font-size:.82rem}}</style><main><div class="bar"><a href="./">← Frigo Solo</a><h1>Logistique</h1><p id="state">Vérification des droits…</p></div><section id="app" hidden><div class="stats"><div class="stat"><b id="users">–</b>comptes</div><div class="stat"><b id="foods">–</b>articles en base</div><div class="stat"><b id="shops">–</b>lignes de courses</div></div><div class="card"><h2>Comptes</h2><table><thead><tr><th>E-mail</th><th>Inscrit le</th><th>Articles</th><th>Courses</th><th>Droit</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://xxvxmefrrkuurlnxyxsn.supabase.co','sb_publishable_sb_FFicGYl7AZS8wxL8GvA_ev8j0Btp'),state=document.querySelector('#state');const{data:{session}}=await s.auth.getSession();if(!session){state.innerHTML='Connecte-toi d’abord dans <a href="./">Frigo Solo</a>.'}else{const{data,error}=await s.rpc('admin_dashboard');if(error){state.textContent='Accès refusé : ce compte n’est pas administrateur.'}else{state.textContent='Console privée — accès administrateur confirmé.';document.querySelector('#app').hidden=false;document.querySelector('#users').textContent=data.total_users;let f=0,q=0;document.querySelector('#rows').innerHTML=data.users.map(u=>{f+=u.foods;q+=u.shopping;return '<tr><td>'+u.email+'</td><td>'+new Date(u.created_at).toLocaleDateString('fr-FR')+'</td><td>'+u.foods+'</td><td>'+u.shopping+'</td><td>'+(u.admin?'<span class="tag">admin</span>':'—')+'</td></tr>'}).join('');document.querySelector('#foods').textContent=f;document.querySelector('#shops').textContent=q}}</script></html>
